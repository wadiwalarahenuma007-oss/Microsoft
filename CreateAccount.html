<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Microsoft</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="Assets/favicon.ico" type="image/x-icon">
</head>

<body class="min-h-screen flex items-center justify-center relative overflow-hidden" style="background-image:url('Assets/Bacground-Image.svg');
background-size:cover; background-position:center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">


    <div class="bg-[#292929] w-[488px] px-10 pt-12 pb-10 rounded-3xl shadow-2xl text-center">

        <div class="flex justify-center items-center gap-2 mb-10">
            <svg width="22" height="22">
                <rect x="0" y="0" width="10" height="10" fill="#F25022" />
                <rect x="11" y="0" width="10" height="10" fill="#7FBA00" />

                <rect x="0" y="11" width="10" height="10" fill="#00A4EF" />
                <rect x="11" y="11" width="10" height="10" fill="#FFB900" />
            </svg>
            <p class="text-white text-[18px] font-medium">Microsoft</p>
        </div>

        <h1 class="text-white text-[24px] font-semibold mb-3">Create your Microsoft account</h1>

        <p class="text-white text-[16px] mb-8">Enter your email address.</p>

        <input type="email" placeholder="Email or phone number"
            class="w-full bg-transparent border border-gray-600 rounded-md px-4 py-3 text-white placeholder-gray-400 focus:outline-none  focus:border-blue-400 focus:ring-0 flex-shrink-0 pr-[12px] pl-[12px] items-stretch flex-grow-0 p-[12px]">


        <button class="w-full h-[42px] mt-8 bg-[#0067B8] hover:bg-[#005ca8] text-white rounded-md font-medium">
            Next
        </button>

        <p class="text-[#d6d6d6] text-sm mt-8">Already have an account?
            <a href="SignIn.html" class="text-[#479ef5] text-[14px] font-semibold font-sans hover:underline">Sign in</a>
        </p>
    </div>
    <div class="absolute bottom-5 flex gap-8 text-[#d6d6d6] font-sans font-semibold text-[12px]">
        <a href="#">Help and feedback</a>
        <a href="#">Terms of use</a>
        <a href="#">Privacy and cookies</a>
    </div>
    <span class="absolute bottom-0 text-[#d6d6d6] text-[10px] font-sans font-semibold ">Use private browsing if this is
        not your device. <a href="#" class="text-[#479ef5] text-[10px] font-semibold font-sans hover:underline">Learn
            more</a></span>
</body>

</html>
